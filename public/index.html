<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  :root {
    --ink: #1c1b19;
    --paper: #faf8f4;
    --accent: #2e5339;
    --accent-soft: #e7ede8;
    --line: #d9d5cb;
    --error: #b3261e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    color: var(--ink);
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 40px 36px;
  }

  .mark {
    width: 36px;
    height: 36px;
    border: 1.5px solid var(--ink);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    margin-bottom: 24px;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: 0.2px;
  }

  .sub {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13.5px;
    color: #6b675f;
    margin: 0 0 28px;
  }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 3px;
  }

  .tab {
    flex: 1;
    text-align: center;
    padding: 8px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: #6b675f;
    background: none;
    border: none;
    border-radius: 3px;
    cursor: pointer;
  }

  .tab.active {
    background: #fff;
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }

  form { display: flex; flex-direction: column; gap: 18px; }

  .field { display: flex; flex-direction: column; gap: 6px; }

  label {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #6b675f;
  }

  input {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--paper);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input::placeholder { color: #a7a297; }

  input:focus, input:focus-visible {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .error-msg {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 12.5px;
    color: var(--error);
    min-height: 16px;
    margin-top: -6px;
  }

  button[type="submit"] {
    margin-top: 8px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  button[type="submit"]:hover { background: #234029; }
  button[type="submit"]:active { transform: translateY(1px); }
  button[type="submit"]:disabled { opacity: 0.6; cursor: default; }

  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .logout-btn {
    margin-top: 8px;
    width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    padding: 10px;
    background: none;
    color: var(--accent);
    border: 1px solid var(--line);
    border-radius: 3px;
    cursor: pointer;
  }

  .logout-btn:hover { background: var(--accent-soft); }

  .otp-row {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .otp-box {
    width: 44px;
    height: 52px;
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    border: 1.5px solid var(--line);
    border-radius: 6px;
    background: var(--paper);
    color: var(--ink);
    outline: none;
    padding: 0;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .otp-box:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .otp-box.filled {
    border-color: var(--accent);
  }

  .otp-row.shake {
    animation: shake 0.4s ease;
  }

  .otp-row.shake .otp-box {
    border-color: var(--error);
  }

  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }

  .otp-timer {
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    color: #6b675f;
  }

  .otp-timer .mono {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: var(--ink);
  }

  .otp-timer.expired .mono { color: var(--error); }

  @media (prefers-reduced-motion: reduce) {
    .otp-row.shake { animation: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }
</style>
</head>
<body>

  <div class="card" id="card">
    <div class="mark">◆</div>
    <h1 id="heading">Sign in</h1>
    <p class="sub" id="subheading">Enter your details to continue.</p>

    <div class="tabs">
      <button type="button" class="tab active" id="tabSignin">Sign in</button>
      <button type="button" class="tab" id="tabSignup">Create account</button>
    </div>

    <form id="authForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <div class="cf-turnstile" data-sitekey="0x4AAAAAAEbUkuBNE8dB3PsZ" data-callback="onTurnstileSuccess"></div>

      <button type="submit" id="submitBtn">Sign in</button>
    </form>
  </div>

  <script>
    const card = document.getElementById('card');
    const heading = document.getElementById('heading');
    const subheading = document.getElementById('subheading');
    const tabSignin = document.getElementById('tabSignin');
    const tabSignup = document.getElementById('tabSignup');
    const form = document.getElementById('authForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');
    const passwordInput = document.getElementById('password');

    let mode = 'signin';
    let turnstileToken = '';

    window.onTurnstileSuccess = function (token) {
      turnstileToken = token;
    };

    function showVerify(email, opts) {
      opts = opts || {};
      const TTL_SECONDS = 15 * 60; // matches VERIFICATION_CODE_TTL_MINUTES on the server

      card.innerHTML =
        '<div class="mark">◆</div>' +
        '<h1>Check your email</h1>' +
        '<p class="sub">We sent a 6-digit code to ' + email + '.</p>' +
        '<form id="verifyForm" novalidate>' +
          '<div class="otp-row" id="otpRow">' +
            Array.from({ length: 6 }, (_, i) =>
              '<input class="otp-box" type="text" inputmode="numeric" maxlength="1" ' +
              'autocomplete="' + (i === 0 ? 'one-time-code' : 'off') + '" data-i="' + i + '">'
            ).join('') +
          '</div>' +
          '<p class="otp-timer" id="otpTimer">Code expires in <span class="mono" id="otpClock">15:00</span></p>' +
          '<div class="error-msg" id="verifyError" style="text-align:center;"></div>' +
          '<button type="submit" id="verifySubmit">Verify</button>' +
        '</form>' +
        '<button type="button" id="resendBtn" class="logout-btn">Resend code</button>';

      const verifyForm = document.getElementById('verifyForm');
      const verifyError = document.getElementById('verifyError');
      const verifySubmit = document.getElementById('verifySubmit');
      const resendBtn = document.getElementById('resendBtn');
      const otpRow = document.getElementById('otpRow');
      const otpTimer = document.getElementById('otpTimer');
      const otpClock = document.getElementById('otpClock');
      const boxes = Array.from(otpRow.querySelectorAll('.otp-box'));

      if (opts.notice) verifyError.textContent = opts.notice;

      // ---- digit box behavior: type-to-advance, backspace, paste ----
      boxes.forEach((box, i) => {
        box.addEventListener('input', () => {
          box.value = box.value.replace(/[^0-9]/g, '').slice(0, 1);
          box.classList.toggle('filled', box.value !== '');
          if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
          if (boxes.every(b => b.value)) verifyForm.requestSubmit();
        });
        box.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !box.value && i > 0) {
            boxes[i - 1].focus();
          }
        });
        box.addEventListener('paste', (e) => {
          e.preventDefault();
          const digits = (e.clipboardData.getData('text') || '').replace(/[^0-9]/g, '').slice(0, boxes.length);
          digits.split('').forEach((d, idx) => {
            if (boxes[idx]) {
              boxes[idx].value = d;
              boxes[idx].classList.add('filled');
            }
          });
          const next = boxes[Math.min(digits.length, boxes.length - 1)];
          if (next) next.focus();
          if (boxes.every(b => b.value)) verifyForm.requestSubmit();
        });
      });
      boxes[0].focus();

      // ---- countdown timer ----
      let remaining = TTL_SECONDS;
      function tick() {
        const m = Math.floor(remaining / 60).toString().padStart(2, '0');
        const s = (remaining % 60).toString().padStart(2, '0');
        otpClock.textContent = m + ':' + s;
        if (remaining <= 0) {
          otpTimer.classList.add('expired');
          otpTimer.innerHTML = 'Code expired — request a new one.';
          clearInterval(timerId);
          return;
        }
        remaining -= 1;
      }
      tick();
      let timerId = setInterval(tick, 1000);

      function shakeAndClear(message) {
        verifyError.textContent = message;
        boxes.forEach(b => { b.value = ''; b.classList.remove('filled'); });
        otpRow.classList.remove('shake');
        void otpRow.offsetWidth; // restart animation
        otpRow.classList.add('shake');
        boxes[0].focus();
      }

      verifyForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        const code = boxes.map(b => b.value).join('');
        if (code.length !== 6) {
          shakeAndClear('Enter all 6 digits.');
          return;
        }
        verifySubmit.disabled = true;
        verifyError.textContent = '';
        try {
          const res = await fetch('/api/verify-email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, code }),
          });
          const data = await res.json();
          if (!res.ok) {
            shakeAndClear(data.error || 'Something went wrong.');
            verifySubmit.disabled = false;
            return;
          }
          clearInterval(timerId);
          showWelcome(data.email);
        } catch (err) {
          shakeAndClear('Could not reach the server. Try again.');
          verifySubmit.disabled = false;
        }
      });

      resendBtn.addEventListener('click', async function () {
        resendBtn.disabled = true;
        verifyError.textContent = '';
        try {
          await fetch('/api/resend-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email }),
          });
          verifyError.textContent = 'A new code has been sent.';
          remaining = TTL_SECONDS;
          otpTimer.classList.remove('expired');
          clearInterval(timerId);
          timerId = setInterval(tick, 1000);
          tick();
        } catch (err) {
          verifyError.textContent = 'Could not reach the server. Try again.';
        }
        setTimeout(() => { resendBtn.disabled = false; }, 15000);
      });
    }

    function showWelcome(email) {
      const name = email.split('@')[0];
      card.innerHTML =
        '<div class="mark">◆</div>' +
        '<h1>Welcome, ' + name + '</h1>' +
        '<p class="sub">You\'re signed in as ' + email + '.</p>' +
        '<button type="button" id="logoutBtn" class="logout-btn">Sign out</button>';
      document.getElementById('logoutBtn').addEventListener('click', async function () {
        await fetch('/api/logout', { method: 'POST' });
        location.reload();
      });
    }

    // If a session cookie is already valid, skip the form entirely.
    (async function checkSession() {
      try {
        const res = await fetch('/api/me');
        if (res.ok) {
          const data = await res.json();
          showWelcome(data.email);
        }
      } catch (err) {
        // Not signed in, or request failed — show the form as normal.
      }
    })();

    function setMode(newMode) {
      mode = newMode;
      errorMsg.textContent = '';
      if (mode === 'signin') {
        tabSignin.classList.add('active');
        tabSignup.classList.remove('active');
        heading.textContent = 'Sign in';
        subheading.textContent = 'Enter your details to continue.';
        submitBtn.textContent = 'Sign in';
        passwordInput.autocomplete = 'current-password';
      } else {
        tabSignup.classList.add('active');
        tabSignin.classList.remove('active');
        heading.textContent = 'Create account';
        subheading.textContent = 'Use at least 8 characters for your password.';
        submitBtn.textContent = 'Create account';
        passwordInput.autocomplete = 'new-password';
      }
    }

    tabSignin.addEventListener('click', () => setMode('signin'));
    tabSignup.addEventListener('click', () => setMode('signup'));

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        errorMsg.textContent = 'Enter both an email and a password.';
        return;
      }
      if (!turnstileToken) {
        errorMsg.textContent = 'Please complete the verification check.';
        return;
      }

      submitBtn.disabled = true;
      errorMsg.textContent = '';

      try {
        const endpoint = mode === 'signin' ? '/api/login' : '/api/signup';
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, turnstileToken }),
        });
        const data = await res.json();

        if (!res.ok) {
          if (data.needsVerification) {
            showVerify(data.email, mode === 'signin' ? { notice: data.error } : {});
            return;
          }
          errorMsg.textContent = data.error || 'Something went wrong.';
          submitBtn.disabled = false;
          return;
        }

        if (data.needsVerification) {
          showVerify(data.email);
          return;
        }

        showWelcome(data.email);
      } catch (err) {
        errorMsg.textContent = 'Could not reach the server. Try again.';
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
